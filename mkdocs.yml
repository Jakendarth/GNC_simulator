site_name: GNC Simulator · User Manual
site_description: Installation, simulation workflows, GNC algorithms and developer reference for GNC Simulator.
site_url: https://jakendarth.github.io/GNC_simulator/
repo_url: https://github.com/Jakendarth/GNC_simulator
repo_name: Jakendarth/GNC_simulator
docs_dir: docs
site_dir: site
strict: true
watch:
  - openwiki
hooks:
  - scripts/docs_openwiki.py

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/ferry
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra_css:
  - assets/stylesheets/extra.css

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Getting Started:
      - Overview: index.md
      - Quickstart: openwiki/quickstart.md
  - Installation:
      - Environment and first run: installation.md
  - User Guide:
      - Running and inspecting results: user-guide.md
  - Simulation Scenarios:
      - Available scenarios: scenarios.md
      - Configuration, assets and results: openwiki/workflows/scenarios-results.md
  - GNC Algorithms:
      - Guidance and anti-grounding control: openwiki/concepts/guidance-control.md
  - Developer Guide:
      - Simulation lifecycle and state: openwiki/architecture/simulation-state.md
      - Validation and known gaps: openwiki/testing/validation.md
      - Maintaining this manual: developer/documentation.md
      - OpenWiki indexes:
          - All documentation: openwiki/index.md
          - Architecture: openwiki/architecture/index.md
          - Concepts: openwiki/concepts/index.md
          - Testing: openwiki/testing/index.md
          - Workflows: openwiki/workflows/index.md
