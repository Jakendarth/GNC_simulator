name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'openwiki/**'
      - 'docs/**'
      - 'scripts/docs_openwiki.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'src/**/*.py'
      - 'main.py'
      - 'plot_results.py'
      - 'assets/GNC_sim_logo.png'
      - 'output/*.mp4'
  pull_request:
    branches: [main]
    paths:
      - 'openwiki/**'
      - 'docs/**'
      - 'scripts/docs_openwiki.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'src/**/*.py'
      - 'main.py'
      - 'plot_results.py'
      - 'assets/GNC_sim_logo.png'
      - 'output/*.mp4'
  workflow_dispatch:

permissions:
  contents: read

# Serialize production runs without interrupting an active deployment.
# PR validation has a separate group for each pull request.
concurrency:
  group: docs-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build manual
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build and validate documentation
        run: mkdocs build --strict
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy manual
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
